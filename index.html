<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var theme = localStorage.getItem('qh-theme')
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        } else {
          document.documentElement.style.colorScheme = 'light'
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg?v=1" />
    <script>
      try {
        if (localStorage.getItem('qh-theme') === 'dark') {
          document.querySelector("link[rel='icon']").href =
            '/favicon-dark.svg?v=1'
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tilāwah – минималистичное чтение Корана и хадисов. Русский / English."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://verses.quran.foundation" crossorigin />
    <link
      rel="preload"
      href="https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tilāwah – Коран и хадисы</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
